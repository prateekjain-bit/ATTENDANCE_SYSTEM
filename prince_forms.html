<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forms</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-5 sm:p-6">
    <h1 class="text-xl sm:text-2xl font-bold text-gray-800 text-center mb-6">Prince Activity Tracker Forms</h1>

    <div class="flex flex-col gap-3">
      <a href="https://prateekjain-bit.github.io/ATTENDANCE_SYSTEM/prince.html" target="_blank" rel="noopener noreferrer"
         class="w-full text-center bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-3 px-4 rounded-xl shadow transition">
        Phonepe Statement Upload Form
      </a>

      <button type="button" onclick="openFormModal('Cash In/Out Form','https://docs.google.com/forms/d/e/1FAIpQLSewokd8sUR90OY0C4sGw2eBIPL0quAYzMGJtkcxvMknuHDDSA/viewform?usp=header&embedded=true')"
         class="w-full text-center bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-medium py-3 px-4 rounded-xl shadow transition">
        Cash In/Out Form
      </button>

      <a href="https://docs.google.com/forms/d/e/1FAIpQLSfAhdcc0C2hicq2eBtZMROHfUij5dd_odt1BKviYXywFsXD_g/viewform?usp=header" target="_blank" rel="noopener noreferrer"
         class="w-full text-center bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium py-3 px-4 rounded-xl shadow transition">
        Attendance Tracker Form
      </a>

      <a href="https://docs.google.com/forms/d/e/1FAIpQLSf1R8HKpzBk0ZoOXRbeLGiirXM4GLL9DJT2hlSu2-WcxMMS_w/viewform?usp=header" target="_blank" rel="noopener noreferrer"
         class="w-full text-center bg-purple-600 hover:bg-purple-700 active:bg-purple-800 text-white font-medium py-3 px-4 rounded-xl shadow transition">
        Weight Tracker Form
      </a>

      <button type="button" onclick="openFormModal('Water Tracker Form','https://docs.google.com/forms/d/e/1FAIpQLSf2c-z44JePceNPZMVMbwYJZEJbOcGu5DoHMpXJOnsx2On9TQ/viewform?usp=header&embedded=true')"
         class="w-full text-center bg-sky-600 hover:bg-sky-700 active:bg-sky-800 text-white font-medium py-3 px-4 rounded-xl shadow transition">
        Water Tracker Form
      </button>

      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeZwMkNWeUxj44XMg1qVxFIK6Mz5DSwlEN97KIMcbv4cM1TFQ/viewform?usp=header" target="_blank" rel="noopener noreferrer"
         class="w-full text-center bg-amber-600 hover:bg-amber-700 active:bg-amber-800 text-white font-medium py-3 px-4 rounded-xl shadow transition">
        Meal Tracker Form
      </a>

      <button type="button" onclick="openFormModal('Activity Tracker In Minutes','https://docs.google.com/forms/d/e/1FAIpQLSfYazB8X5fVXPmVFQX3vmSVaPqDeBkIQJEv5q4EyYCUpppoSw/viewform?usp=header&embedded=true')"
         class="w-full text-center bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white font-medium py-3 px-4 rounded-xl shadow transition">
        Activity Tracker In Minutes
      </button>

      <button type="button" onclick="openFormModal('Delegation Form','https://docs.google.com/forms/d/e/1FAIpQLSf2a6FvrVXL4Gq-XZ2iJg-o3hYX9z0iNFGhFNqrw45C-cSLKQ/viewform?embedded=true')"
         class="w-full text-center bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white font-medium py-3 px-4 rounded-xl shadow transition">
        Delegation Form
      </button>
    </div>
  </div>

  <!-- Modal -->
  <div id="form-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" onclick="closeFormModal()"></div>
    <div class="relative mx-auto mt-6 sm:mt-10 w-[95%] sm:w-full sm:max-w-lg bg-white rounded-2xl shadow-xl flex flex-col overflow-hidden" style="height: 85vh;">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200">
        <h2 id="modal-title" class="text-base sm:text-lg font-semibold text-gray-800 truncate pr-2"></h2>
        <button type="button" onclick="closeFormModal()"
                class="shrink-0 w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 text-xl leading-none">
          &times;
        </button>
      </div>
      <div class="flex-1 overflow-hidden">
        <iframe id="modal-iframe" src="" class="w-full h-full" style="border:0;"></iframe>
      </div>
    </div>
  </div>

  <script>
    function openFormModal(title, url) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-iframe').src = url;
      document.getElementById('form-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
    function closeFormModal() {
      document.getElementById('form-modal').classList.add('hidden');
      document.getElementById('modal-iframe').src = '';
      document.body.style.overflow = '';
    }
  </script>
</body>
</html>
